<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SKALLA — Art. Books. Performance.</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top {
      padding: 24px 22px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 6px;
    }

    .menu {
      font-size: 13px;
      letter-spacing: 2px;
      opacity: 0.75;
    }

    .hero {
      flex: 1;
      display: grid;
      grid-template-columns: 52% 48%;
      min-height: calc(100vh - 90px);
    }

    .photo {
      position: relative;
      overflow: hidden;
      min-height: 650px;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 8vw 60px 7vw;
    }

    .small {
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 20px;
      opacity: 0.6;
    }

    h1 {
      font-size: clamp(48px, 7vw, 105px);
      line-height: 0.9;
      font-weight: 700;
      letter-spacing: -3px;
      margin-bottom: 28px;
    }

    .subtitle {
      max-width: 520px;
      font-size: 17px;
      line-height: 1.6;
      color: #bcbcbc;
      margin-bottom: 42px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 410px;
    }

    .btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: #fff;
      border: 1px solid #444;
      padding: 19px 20px;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: 0.25s;
    }

    .btn:hover {
      background: #fff;
      color: #000;
    }

    .arrow {
      font-size: 18px;
    }

    @media (max-width: 800px) {
      .top {
        padding: 20px 18px;
      }

      .logo {
        font-size: 23px;
        letter-spacing: 5px;
      }

      .menu {
        display: none;
      }

      .hero {
        display: block;
        min-height: auto;
      }

      .photo {
        width: 100%;
        height: 58vh;
        min-height: 430px;
      }

      .photo img {
        object-position: center top;
      }

      .content {
        padding: 42px 22px 60px;
      }

      h1 {
        font-size: 52px;
        line-height: 0.92;
        letter-spacing: -2px;
      }

      .subtitle {
        font-size: 15px;
        margin-bottom: 30px;
      }

      .buttons {
        max-width: none;
      }

      .btn {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <header class="top">
    <div class="logo">SKALLA</div>
    <div class="menu">ART · BOOKS · PERFORMANCE</div>
  </header>

  <main class="hero">

    <section class="photo">
      <img src="IMG_1699.jpeg" alt="SKALLA">
    </section>

    <section class="content">

      <div class="small">Writer · Artist · Performance</div>

      <h1>
        HEART<br>
        OF A<br>
        SHAMAN
      </h1>

      <p class="subtitle">
        Я перетворюю прожите на мистецтво.
        Тексти, поезія, образи та колекційні арт-об’єкти.
      </p>

      <div class="buttons">

        <a class="btn" href="#">
          СЕРЦЕ ШАМАНКИ
          <span class="arrow">→</span>
        </a>

        <a class="btn" href="#">
          НЕПОЛКОВНИК ІСАЄВ
          <span class="arrow">→</span>
        </a>

        <a class="btn" href="#">
          ART / PERFORMANCE
          <span class="arrow">→</span>
        </a>

        <a class="btn" href="#">
          ABOUT SKALLA
          <span class="arrow">→</span>
        </a>

      </div>

    </section>

  </main>

</div>

</body>
</html>
