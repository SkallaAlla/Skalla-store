<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skalla</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #f1ece4;
      font-family: Georgia, "Times New Roman", serif;
      color: #111;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px 40px;
    }

    .photo-wrap {
      width: min(92vw, 430px);
      overflow: hidden;
    }

    .photo-wrap img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
    }

    .brand {
      margin-top: 22px;
      font-size: 46px;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1;
    }

    .subtitle {
      margin-top: 12px;
      font-size: 17px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
    }

    .buttons {
      width: min(92vw, 430px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 30px;
    }

    .btn {
      width: 100%;
      display: block;
      text-align: center;
      padding: 15px 18px;
      border: 1px solid #111;
      background: transparent;
      color: #111;
      text-decoration: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: 0.2s ease;
    }

    .btn:hover {
      background: #111;
      color: #f1ece4;
    }

    @media (max-width: 480px) {
      .page {
        padding-top: 18px;
      }

      .brand {
        font-size: 38px;
      }

      .subtitle {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="photo-wrap">
      <img src="photo.jpg" alt="Skalla">
    </div>

    <div class="brand">SKALLA</div>

    <div class="subtitle">
      Writer · Artist · Performance
    </div>

    <div class="buttons">
      <a class="btn" href="#">Heart of the Shaman</a>
      <a class="btn" href="#">Nepolkovnik Isaev</a>
      <a class="btn" href="#">About</a>
    </div>

  </main>

</body>
</html>
